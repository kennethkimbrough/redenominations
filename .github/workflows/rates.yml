name: Update exchange rates

# Fetches today's USD rates for every country's current unit and commits
# data/rates.json when they change. The Pages workflow then redeploys.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 data/fetch_rates.py
      - run: python3 -m unittest discover -s tests
      - name: Commit if changed
        run: |
          git config user.name "Kenneth Kimbrough"
          git config user.email "146112017+kennethkimbrough@users.noreply.github.com"
          git add data/rates.json
          if git diff --cached --quiet; then echo "rates unchanged"; exit 0; fi
          git commit -m "Update exchange rates ($(python3 -c 'import json;print(json.load(open("data/rates.json"))["date"])'))"
          git push
